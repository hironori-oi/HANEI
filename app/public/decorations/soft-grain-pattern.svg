<?xml version="1.0" encoding="UTF-8"?>
<!--
  HANEI / DEC-091 / 項目 A: card decoration (very subtle grain)
  使用箇所: [data-card-decoration="true"] のカード装飾
  - viewBox 120x120 / tileable
  - opacity ~0.04 で適用
-->
<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" aria-hidden="true">
  <g fill="#f2a93a" opacity="0.5">
    <circle cx="10" cy="14" r="0.8"/>
    <circle cx="48" cy="22" r="0.6"/>
    <circle cx="82" cy="10" r="0.7"/>
    <circle cx="106" cy="36" r="0.6"/>
    <circle cx="22" cy="58" r="0.7"/>
    <circle cx="64" cy="62" r="0.6"/>
    <circle cx="100" cy="74" r="0.8"/>
    <circle cx="14" cy="92" r="0.6"/>
    <circle cx="58" cy="100" r="0.7"/>
    <circle cx="92" cy="110" r="0.6"/>
    <circle cx="36" cy="42" r="0.5"/>
    <circle cx="76" cy="86" r="0.5"/>
  </g>
  <g stroke="#b8a4e0" stroke-width="0.6" stroke-linecap="round" opacity="0.4">
    <line x1="20" y1="30" x2="24" y2="34"/>
    <line x1="86" y1="50" x2="90" y2="54"/>
    <line x1="44" y1="84" x2="48" y2="88"/>
    <line x1="106" y1="98" x2="110" y2="102"/>
  </g>
</svg>
