<?xml version="1.0" encoding="UTF-8"?>
<!--
  HANEI / DEC-091 / 項目 A: 背景 pattern (stars + clouds)
  Subtle seamless tile (4-pointed sparkles + soft clouds).
  - viewBox 200x200 / tileable
  - 罰則ゼロ哲学厳守 (DEC-024)
  - Sky Blue (#4FC3F7) + Lavender (#B8A4E0) accent
  - aria-hidden="true" 前提 (decoration only)
  - bundle: ~1-2 KB
-->
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <!-- 4-pointed sparkle (★) -->
    <g id="sparkle">
      <path d="M0 -8 C0.6 -2 2 -0.6 8 0 C2 0.6 0.6 2 0 8 C-0.6 2 -2 0.6 -8 0 C-2 -0.6 -0.6 -2 0 -8 Z"
        fill="#7ec9ed" opacity="0.55"/>
    </g>
    <!-- soft cloud puff -->
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="14" ry="6" fill="#cdd9ec" opacity="0.6"/>
      <ellipse cx="-7" cy="-3" rx="7" ry="5" fill="#cdd9ec" opacity="0.6"/>
      <ellipse cx="6" cy="-3" rx="8" ry="5" fill="#cdd9ec" opacity="0.6"/>
      <ellipse cx="-3" cy="-5" rx="5" ry="4" fill="#dde6f3" opacity="0.55"/>
    </g>
    <!-- tiny star (lavender) -->
    <g id="tinyStar">
      <circle cx="0" cy="0" r="1.6" fill="#b8a4e0" opacity="0.65"/>
    </g>
  </defs>

  <!-- 6 sparkles / 2 clouds / 5 tiny stars をタイル可能配置 -->
  <use href="#sparkle" transform="translate(34,28) scale(1.0)"/>
  <use href="#sparkle" transform="translate(162,52) scale(0.9)"/>
  <use href="#sparkle" transform="translate(96,88) scale(1.1)"/>
  <use href="#sparkle" transform="translate(178,128) scale(0.85)"/>
  <use href="#sparkle" transform="translate(20,168) scale(1.0)"/>
  <use href="#sparkle" transform="translate(116,180) scale(0.9)"/>

  <use href="#cloud" transform="translate(56,108) scale(1.0)"/>
  <use href="#cloud" transform="translate(150,158) scale(0.85)"/>

  <use href="#tinyStar" transform="translate(70,18)"/>
  <use href="#tinyStar" transform="translate(140,90)"/>
  <use href="#tinyStar" transform="translate(40,76)"/>
  <use href="#tinyStar" transform="translate(186,32)"/>
  <use href="#tinyStar" transform="translate(98,148)"/>
</svg>
