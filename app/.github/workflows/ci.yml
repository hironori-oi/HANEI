name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/PRJ-016/app/package-lock.json
      - name: Install
        working-directory: projects/PRJ-016/app
        run: npm ci
      - name: Lint
        working-directory: projects/PRJ-016/app
        run: npm run lint
      - name: TypeCheck
        working-directory: projects/PRJ-016/app
        run: npm run typecheck

  test:
    name: Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/PRJ-016/app/package-lock.json
      - name: Install
        working-directory: projects/PRJ-016/app
        run: npm ci
      - name: Run unit tests with coverage
        working-directory: projects/PRJ-016/app
        run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: projects/PRJ-016/app/coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/PRJ-016/app/package-lock.json
      - name: Install
        working-directory: projects/PRJ-016/app
        run: npm ci
      - name: Build
        working-directory: projects/PRJ-016/app
        run: npm run build
        env:
          # ダミー値で build pass させる (Vercel 上では実値を注入)
          BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-padding-xx
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/PRJ-016/app/package-lock.json
      - name: Install
        working-directory: projects/PRJ-016/app
        run: npm ci
      - name: Install Playwright browsers
        working-directory: projects/PRJ-016/app
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: projects/PRJ-016/app
        run: npm run e2e
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-padding-xx
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: projects/PRJ-016/app/playwright-report

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/PRJ-016/app/package-lock.json
      - name: Install
        working-directory: projects/PRJ-016/app
        run: npm ci
      - name: Build
        working-directory: projects/PRJ-016/app
        run: npm run build
        env:
          BETTER_AUTH_SECRET: ci-dummy-secret-32-chars-padding-xx
          NEXT_PUBLIC_APP_URL: http://localhost:3000
      - name: Run Lighthouse
        working-directory: projects/PRJ-016/app
        run: |
          npm i -g @lhci/cli
          lhci autorun --collect.startServerCommand="npm run start" --collect.url=http://localhost:3000 --collect.numberOfRuns=1 --upload.target=temporary-public-storage || true
